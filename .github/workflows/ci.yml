name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The browser test (test/e2e.mjs) needs Chrome and the two sibling
  # repositories with a built wasmacs; run it locally.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:unit
      - name: The scripts parse
        run: node --check js/studio.js && node --check js/tar.js && node --check tools/serve.mjs

  # The site is the repository itself: static files, no build step.
  pages:
    name: Publish Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
