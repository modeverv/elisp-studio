name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The browser test (test/e2e.mjs) needs Chrome and the two sibling
  # repositories with a built wasmacs; run it locally.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The MySQL that test/serve-cgi.test.mjs fills (app-server-sql on MySQL).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Emacs (the project server test runs one) and the MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox mysql-client
      - name: The MySQL option file of the tests
        run: |
          printf '[client]\nhost=127.0.0.1\nport=3306\nuser=test\npassword=test\ndefault-character-set=utf8mb4\n\n[mysql]\ndatabase=test\n' > "$RUNNER_TEMP/test.cnf"
          chmod 600 "$RUNNER_TEMP/test.cnf"
          mysql --defaults-extra-file="$RUNNER_TEMP/test.cnf" -e 'SELECT VERSION()'
          echo "APP_SERVER_TEST_MYSQL=$RUNNER_TEMP/test.cnf" >> "$GITHUB_ENV"
      - run: npm run test:unit
      - name: The scripts parse
        run: node --check js/studio.js && node --check js/tar.js && node --check tools/serve.mjs

  # The downloaded project in a container (Dockerfile, docker-compose.yml):
  # the template, built and started with docker compose, checked from
  # outside, over HTTP and over HTTPS (test/docker.mjs).
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:docker

  # The site is the repository itself: static files, no build step.
  pages:
    name: Publish Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
