# nginx in front of this application: goes into the http { } block (on
# Debian and Ubuntu: a file in /etc/nginx/conf.d/).  nginx does HTTPS and
# compression; Emacs, on the same machine, does the rest.  Replace
# example.com and the certificate paths, then:
#
#   PUBLIC_ORIGIN=https://example.com ./run.sh

upstream emacs_application {
    least_conn;
    server 127.0.0.1:8018;
    # Several cores: one Emacs uses one.  WORKERS=4 ./run.sh starts four:
    # server 127.0.0.1:8019;
    # server 127.0.0.1:8020;
    # server 127.0.0.1:8021;
    keepalive 16;                       # connections to Emacs that stay open
}

server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # The largest request body.  1m is what the application takes as text;
    # if server.el takes files (app-server-upload-p), the largest of those.
    client_max_body_size 1m;
    # With uploads: pass a file on as it arrives instead of storing it first.
    # proxy_request_buffering off;
    # Browsers that were here once come back over HTTPS only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/x-emacs-lisp application/wasm;

    location / {
        proxy_pass http://emacs_application;
        proxy_http_version 1.1;         # with the next line: keep the connection open
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The visitor's address as nginx saw it, not what the visitor claims.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;         # longer than a deferred answer may take (30 s)
    }
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
