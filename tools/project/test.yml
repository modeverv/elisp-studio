# Checks the application at every push: test/run.sh in a native Emacs
# (every .el file compiles without a warning; the tests in test/ pass).
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - run: test/run.sh
